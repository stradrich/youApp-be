version: "3.8"

services:
  mongo:
    image: mongo:6
    container_name: mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: youapp
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: youapp-be
    command: npm run start:dev
    ports:
      - "3005:3005"
    env_file:
      - .env
    environment:
      DOCKER_ENV: true
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - mongo

volumes:
  mongo_data:
